<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner</title>
    <link rel="stylesheet" href="diano style.css">
</head>
<body>
    <main class="game-wrapper">
        <section class="game-card">
            <div class="top-bar">
                <h1>
                     Dino Runner
                </h1>
                <div class="score-area">
                    <span>
                        Score:
                        <b id="score">0</b>
                    </span>
                    <span>
                        Best:
                        <b id="bestScore">0</b>
                    </span>
                </div>
            </div>


            <div class="game-area">
                <canvas id="gameCanvas" width="900" height="300"></canvas>
                <div id="startScreen" class="screen">
                    <h2>
                        Ready To Run?
                    </h2>
                    <p>
                        Press SPACE or TAP to Jump
                    </p>
                    <button id="startBtn">
                        Start Game
                    </button>
                </div>

                <div id="gameOver" class="screen hidden">
                    <h2>
                        Game Over 
                    </h2>
                    <p>
                        Your Score:
                        <b id="finalScore">0</b>
                    </p>
                    <button id="restartBtn">
                        Run Again
                    </button>
                </div>

            </div>


            <div class="controls">
                <button id="jumpBtn">
                    ⬆ Jump
                </button>
                <button id="pauseBtn">
                    ⏸ Pause
                </button>
            </div>


            <div class="tips">
                <p>
                    Keyboard:
                    SPACE / ↑ = Jump
                </p>
                <p>
                    Avoid the obstacles and beat your high score!
                </p>
            </div>
        </section>
    </main>



<script src="diano.js"></script>

</body>

</html>
